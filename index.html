<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharma Electronics Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0d6efd;
  --dark:#111;
  --light:#f8f9fa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f4f6f9;
  padding-bottom:100px;
}

/* Header */
header{
  background:var(--primary);
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:22px;
}

header p{
  font-size:14px;
  opacity:0.9;
}

/* Category Buttons */
.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:15px;
}

.categories button{
  padding:8px 15px;
  border:none;
  background:white;
  border-radius:20px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.categories button.active{
  background:var(--primary);
  color:white;
}

/* Product Grid */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:15px;
}

.product{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
  transition:0.3s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

.product h3{
  font-size:14px;
  margin:8px 0;
}

.product p{
  font-size:13px;
  color:#555;
}

.price{
  font-weight:600;
  margin:5px 0;
}

.add-btn{
  width:100%;
  padding:7px;
  border:none;
  background:var(--primary);
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* Cart Button */
.cart-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--primary);
  color:white;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  font-size:12px;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

/* Cart Modal */
.cart-modal{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-height:80%;
  background:white;
  border-radius:20px 20px 0 0;
  box-shadow:0 -5px 20px rgba(0,0,0,0.2);
  padding:20px;
  overflow:auto;
  transform:translateY(100%);
  transition:0.3s;
}

.cart-modal.active{
  transform:translateY(0);
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.qty-btn{
  padding:3px 8px;
  border:none;
  background:var(--primary);
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.checkout-btn{
  width:100%;
  padding:10px;
  border:none;
  background:green;
  color:white;
  border-radius:6px;
  margin-top:15px;
  cursor:pointer;
}

/* WhatsApp */
.whatsapp{
  position:fixed;
  bottom:90px;
  right:20px;
  background:#25d366;
  color:white;
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>Sharma Electronics Store</h1>
<p>Affordable gadgets delivered in Varanasi, UP</p>
</header>

<div class="categories">
<button onclick="filterCategory('All')" class="active">All</button>
<button onclick="filterCategory('Electronic')">Electronic</button>
</div>

<div class="products" id="productList"></div>

<div class="cart-btn" onclick="toggleCart()">
🛒
<div class="cart-count" id="cartCount">0</div>
</div>

<a class="whatsapp" href="https://wa.me/919999999999" target="_blank">💬</a>

<div class="cart-modal" id="cartModal">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Total: ₹<span id="cartTotal">0</span></h3>
<button class="checkout-btn" onclick="checkout()">Place Order</button>
</div>

<!-- Checkout Form -->
<form id="orderForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" style="display:none;">
<input type="hidden" name="Order Details" id="orderDetails">
<input type="text" name="Customer Name" placeholder="Your Name" required>
<input type="text" name="Phone Number" placeholder="Phone Number" required>
<textarea name="Delivery Address" placeholder="Delivery Address" required></textarea>
<textarea name="Special Instructions" placeholder="Special Instructions (optional)"></textarea>
<button type="submit">Submit Order</button>
</form>

<script>
const products = [
{ id:1,name:"Earbuds",price:400,category:"Electronic",image:"https://i.ibb.co/Vp0tNYnh/IMG-20260302-131217022.jpg",desc:"Gaming earbuds"},
{ id:2,name:"Gaming Light",price:789,category:"Electronic",image:"https://i.ibb.co/SwnFZq66/IMG-20260302-131312980.jpg",desc:"RGB gaming light"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderProducts(category="All"){
const list=document.getElementById("productList");
list.innerHTML="";
products.filter(p=>category==="All"||p.category===category)
.forEach(p=>{
list.innerHTML+=`
<div class="product">
<img src="${p.image}" alt="${p.name}" loading="lazy">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">₹${p.price}</div>
<button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
</div>`;
});
}

function addToCart(id){
const item=cart.find(i=>i.id===id);
if(item){item.qty++;}
else{
const product=products.find(p=>p.id===id);
cart.push({...product,qty:1});
}
saveCart();
}

function saveCart(){
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
}

function updateCart(){
document.getElementById("cartCount").innerText=cart.reduce((a,b)=>a+b.qty,0);
const items=document.getElementById("cartItems");
items.innerHTML="";
let total=0;
cart.forEach(item=>{
total+=item.price*item.qty;
items.innerHTML+=`
<div class="cart-item">
${item.name} x${item.qty} - ₹${item.price*item.qty}
<button onclick="removeItem(${item.id})">❌</button>
</div>`;
});
document.getElementById("cartTotal").innerText=total;
}

function removeItem(id){
cart=cart.filter(i=>i.id!==id);
saveCart();
}

function toggleCart(){
document.getElementById("cartModal").classList.toggle("active");
}

function checkout(){
if(cart.length===0){alert("Cart is empty!");return;}
let summary="";
let total=0;
cart.forEach(item=>{
summary+=`${item.name} x${item.qty} = ₹${item.price*item.qty}\n`;
total+=item.price*item.qty;
});
summary+=`\nTotal: ₹${total}`;
document.getElementById("orderDetails").value=summary;
document.getElementById("orderForm").style.display="block";
}

function filterCategory(cat){
document.querySelectorAll(".categories button").forEach(btn=>btn.classList.remove("active"));
event.target.classList.add("active");
renderProducts(cat);
}

renderProducts();
updateCart();
</script>

</body>
</html>
